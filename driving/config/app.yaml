# app.yaml
# 应用信息
app_name: "远程驾驶控制系统"
app_name_en: "Remote Driving Control"
version: "1.0.0"

# 调试模式（启用后登录页显示快速进入按钮）
debug_mode: false

# UI 配置
ui:
  window_min_width: 1200
  window_min_height: 750
  theme: modern_glass  # 可选: dark_tech | modern_glass

# 定时器间隔 (ms)
timers:
  frame_interval: 5       # ~200fps 帧轮询
  stats_interval: 1000    # 1s 统计刷新
  time_interval: 1000     # 1s 时钟刷新
