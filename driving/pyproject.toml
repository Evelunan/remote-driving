[project]
name = "driving"
version = "0.1.0"
description = "Remote driving desktop control client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rd-core==0.2.0",
    "aiohttp>=3.13.3",
    "aioquic>=1.3.0",
    "aiortc>=1.14.0",
    "libusb1>=3.3.1",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pyopengl>=3.1.10",
    "pyopengl-accelerate>=3.1.10",
    "pyqt6>=6.10.2",
    "pyyaml>=6.0.3",
    "websockets>=16.0",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
