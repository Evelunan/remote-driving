name: Software and wheel acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON: '3.12.16'
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fixed uv version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Install host libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libegl1 libopengl0 libglib2.0-0t64 libusb-1.0-0
      - name: Install the locked workspace
        run: |
          uv python install 3.12.16
          uv sync --all-packages --group dev --locked
          git diff --exit-code -- uv.lock
      - name: Check fatal Python errors
        run: uv run --no-sync ruff check --isolated --select E9,F63,F7,F82 apps packages scripts tests
      - name: Validate service templates without starting services
        run: |
          bash -n deploy/run_vehicle.sh
          systemd-analyze verify --man=no --generators=no deploy/systemd/*.service
      - name: Run software regression tests
        run: uv run --no-sync pytest -q tests --junitxml=artifacts/pytest.xml
      - name: Build six wheels from clean source archives
        run: uv run --no-sync python scripts/build_wheels.py --output-dir artifacts/wheels
      - name: Install and exercise each application independently
        run: uv run --no-sync python scripts/verify_wheels.py --wheels artifacts/wheels --output artifacts/wheel-acceptance.json
      - name: Keep reports and candidate wheels
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-acceptance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
