# ======================
# 车辆运动控制参数 (Vehicle Motion Control)
# ======================
motion:
  # 线速度限制
  max_linear_velocity: 500.0      # 单位: mm/s
  # 角速度限制
  max_angular_velocity: 2.0       # 单位: rad/s

# ======================
# 通信与协议配置 (Communication & Protocol)
# ======================
communication:
  # 串口物理层配置 (Serial Port Settings)
  serial:
    port: "/dev/ttyUSB0"        # 设备路径
    baud_rate: 115200            # 波特率
    read_timeout: 0.001           # 读取超时 (秒)
    write_timeout: 0.001          # 写入超时 (秒)

  # 应用层协议配置 (Application Layer Protocol)
  protocol:
    # 指令帧结构定义 (Command Frame Structure)
    # 注意：加载后需转换为 bytes: bytes(config['communication']['protocol']['frame_template'])
    frame_template:
      - 0xCD                      # [0] Header: 帧头
      - 0x0A                      # [1] Length: 帧长度 (不含校验位)
      - 0x01                      # [2] Command ID: 功能字/命令字
      - 0x00                      # [3] Dir X: X轴方向标志 (0:负, 1:正)
      - 0x00                      # [4] Vel X High: X轴速度高8位
      - 0x00                      # [5] Vel X Low:  X轴速度低8位
      - 0x00                      # [6] Dir Y: Y轴方向标志
      - 0x00                      # [7] Vel Y High: Y轴速度高8位
      - 0x00                      # [8] Vel Y Low:  Y轴速度低8位
      - 0x00                      # [9] Dir Rot: 旋转方向标志
      - 0x00                      # [10] Vel Rot High: 角速度高8位
      - 0x00                      # [11] Vel Rot Low:  角速度低8位
      - 0x00                      # [12] Checksum: 校验位