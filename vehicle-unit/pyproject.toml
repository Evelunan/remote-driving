[project]
name = "vehicle-unit"
version = "0.1.0"
description = "Vehicle-side camera streaming and control receiver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rd-core==0.2.0",
    "aioquic>=1.3.0",
    "aiortc>=1.14.0",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "websockets>=16.0",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
