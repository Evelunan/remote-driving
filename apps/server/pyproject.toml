[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rd-server"
version = "0.2.0"
description = "Unified signaling and QUIC control relay"
requires-python = ">=3.12"
dependencies = ["rd-core==0.2.0", "aioquic>=1.3.0", "websockets>=16.0", "pyyaml>=6.0.3"]

[project.scripts]
rd-server = "rd_server.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rd_server = ["relay/config/*.yaml", "signaling/config/*.yaml"]
