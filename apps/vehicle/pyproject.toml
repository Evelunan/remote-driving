[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rd-vehicle"
version = "0.2.0"
description = "Vehicle-side camera streaming and control receiver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rd-core==0.2.0",
    "rd-quic==0.2.0",
    "rd-webrtc[opencv]==0.2.0",
    "aioquic>=1.3.0",
    "aiortc>=1.14.0",
    "numpy>=2.4.3",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "websockets>=16.0",
]

[project.scripts]
rd-vehicle = "rd_vehicle.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rd_vehicle = ["lib/*.dll"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
