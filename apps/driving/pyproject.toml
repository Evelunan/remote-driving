[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rd-driving"
version = "0.2.0"
description = "Remote driving desktop control client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rd-core==0.2.0",
    "rd-quic==0.2.0",
    "rd-webrtc[opencv]==0.2.0",
    "aioquic>=1.3.0",
    "aiortc>=1.14.0",
    "libusb1>=3.3.1",
    "numpy>=2.4.3",
    "pyqt6>=6.10.2",
    "pyyaml>=6.0.3",
    "websockets>=16.0",
]

[project.scripts]
rd-driving = "rd_driving.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
