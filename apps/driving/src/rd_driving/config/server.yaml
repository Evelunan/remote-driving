# Local examples; deploy credentials are injected separately.
regist:
  host: 127.0.0.1
  port: 8080
  path: /api/vehicle/register
webrtc:
  signaling:
    protocol: ws
    host: 127.0.0.1
    port: 8765
  ice:
    stun: []
quic:
  host: 127.0.0.1
  port: 4433
  options:
    verify_mode: true
    enable_datagrams: true
    max_datagram_frame_size: 65536
    idle_timeout: 3600
