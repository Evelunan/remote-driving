# 无硬件实例：模拟底盘 + 合成视频，不打开 ROS、串口或真实相机。
environment: development
session: 1234
room: "1234"
components: [control, media]
controller: mock
# 可选测试配置：改为 front 后，未配置 source 的视角复用 front。
# 显式 source（包括 synthetic）仍独立采集；要复用请删掉该视角的 source。
camera_fallback_source: null
# 可选：同一媒体进程所有视角和订阅者共享的编码工作线程上限。
# 默认 null 使用 aiortc 原路径；启用每路 encoding 时必须同时设为 1..32。
encoder_workers: null
# 每路摄像头可增设 encoding，例如（数值仅供本地实验）：
# encoding:
#   target_bitrate_bps: 1000000
#   min_bitrate_bps: 250000
#   max_bitrate_bps: 1500000
#   max_threads: 1
# 这是 VP8 编码目标，不是含协议开销的网络速率硬上限。
credentials:
  token_env: RD_VEHICLE_TOKEN
network:
  signaling_url: wss://localhost:8765
  signaling_ca_file: tls/ca.pem
  quic_host: localhost
  quic_port: 4433
  quic_server_name: localhost
  quic_ca_file: tls/ca.pem
motion:
  max_linear_mps: 5.0
  max_angular_radps: 2.0
cameras:
  - name: front
    source: synthetic
    width: 1080
    height: 720
    fps: 30
  - name: back
    source: synthetic
    width: 640
    height: 480
    fps: 30
  - name: left
    source: synthetic
    width: 640
    height: 480
    fps: 30
  - name: right
    source: synthetic
    width: 640
    height: 480
    fps: 30
video:
  primary_view: front
  stale_frame_ms: 500
  recovery_ms: 500
