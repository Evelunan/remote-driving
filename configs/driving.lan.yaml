# 驾驶端实例；令牌从进程环境读取，证书路径相对本文件。
environment: production
session: 1234
room: "1234"
credentials:
  token_env: RD_OPERATOR_TOKEN
network:
  signaling_url: wss://192.168.3.7:8765
  signaling_ca_file: tls/lan-server.pem
  quic_host: 192.168.3.7
  quic_port: 4433
  quic_server_name: 192.168.3.7
  quic_ca_file: tls/lan-server.pem
  ice_servers: []
control:
  send_hz: 50
  input_timeout_ms: 200
  command_timeout_ms: 300
  max_clock_skew_ms: 50
usb:
  vendor_id: 12068  # 0x2f24
  product_id: 9
ui:
  theme: modern_glass
  width: 1200
  height: 750
  frame_interval_ms: 16
  stats_interval_ms: 1000
  debug: false
# VP8 的 RTP 包到齐即送解码；设为 false 可用默认组帧方式做对照。
low_latency_vp8: true
video:
  primary_view: front
  stale_frame_ms: 500
  recovery_ms: 500
