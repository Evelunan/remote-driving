# 车辆端临时摄像头映射：先用本配置验证画面方向，再将确认后的 source
# 合并到正式车辆配置。source 使用 USB 拓扑路径，避免 /dev/videoN 重启变化。
#
# 当前映射（前后已按现场反馈调整，左右待确认）：
#   front -> video8  (USB 4.1，快照为货架/桌面)
#   back  -> video0  (USB 1.1，快照为门口)
#   left  -> video10 (USB 4.2，快照为椅子/货架)
#   right -> video12 (USB 4.3，快照为显示器/桌面)
#   video14 (USB 4.4，快照为地面/车体边缘) 暂作备用
#
# 五路普通摄像头中先发布四路；RealSense 的深度/红外节点不纳入本配置。
# 设备原生输出为 MJPG 640x480@30。PyAV/FFmpeg-V4L2 四路并行实测约
# 30.12 FPS；保留 OpenCV 后端作为显式回退选项。
environment: production
logging:
  level: INFO
  directory: ../logs/vehicle-camera-map
session: 1234
room: "1234"
components: [control,media]
controller: ros2
feedback:
  enabled: true
  topic: /vehicle_status
  wheel_speed_unit: m/s
  send_hz: 10
  stale_timeout_ms: 300
camera_fallback_source: null
encoder_workers: null
credentials:
  token_env: RD_VEHICLE_TOKEN
network:
  signaling_url: wss://192.168.3.7:8765
  signaling_ca_file: tls/lan-server.pem
  quic_host: 192.168.3.7
  quic_port: 4433
  quic_server_name: 192.168.3.7
  quic_ca_file: tls/lan-server.pem
  ice_servers: []
control:
  send_hz: 50
  input_timeout_ms: 200
  command_timeout_ms: 300
  max_clock_skew_ms: 50
motion:
  max_linear_mps: 5.0
  max_angular_radps: 2.0
cameras:
  - name: front
    source: "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:4.1:1.0-video-index0"
    width: 1080
    height: 720
    fps: 30
    capture_backend: pyav
  - name: back
    source: "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.1:1.0-video-index0"
    width: 640
    height: 480
    fps: 30
    capture_backend: pyav
  - name: left
    source: "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:4.2:1.0-video-index0"
    width: 640
    height: 480
    fps: 30
    capture_backend: pyav
  - name: right
    source: "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:4.3:1.0-video-index0"
    width: 640
    height: 480
    fps: 30
    capture_backend: pyav
video:
  primary_view: front
  stale_frame_ms: 500
  recovery_ms: 500
