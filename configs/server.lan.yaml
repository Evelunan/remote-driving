# 认证信令 + QUIC v2 中继。正式客户端已接入；实车参数与部署验收仍待完成。
environment: production
services: [signaling, relay]
logging:
  level: INFO
signaling:
  host: 192.168.3.7
  port: 8765
  max_peers_per_room: 2
  max_message_bytes: 65536
  ping_interval_s: 20
  ping_timeout_s: 20
  send_timeout_s: 3
  close_timeout_s: 3
  tls:
    cert: tls/lan-server.pem
    key: tls/lan-server.key
relay:
  host: 192.168.3.7
  port: 4433
  tls:
    cert: tls/lan-server.pem
    key: tls/lan-server.key
  idle_timeout_s: 10
  register_timeout_s: 5
  lease_ttl_s: 1
  max_control_age_ms: 300
  max_clock_skew_ms: 50
  max_datagram_bytes: 1200
  max_rpc_bytes: 16384
# 身份、角色和资源权限由服务端配置确定，客户端不能自报提升权限。
auth:
  principals:
    - id: vehicle-1234
      role: vehicle
      token_env: RD_VEHICLE_TOKEN
      sessions: [1234]
      rooms: ["1234"]
    - id: operator-1234
      role: driving
      token_env: RD_OPERATOR_TOKEN
      sessions: [1234]
      rooms: ["1234"]
    - id: viewer-1234
      role: viewer
      token_env: RD_VIEWER_TOKEN
      sessions: []
      rooms: ["1234"]
# 可为各身份设置带时区的 expires_at，过期后会关闭已有信令连接。
