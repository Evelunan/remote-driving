[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rd-core"
version = "0.2.0"
description = "Shared remote-driving control and runtime contracts"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
