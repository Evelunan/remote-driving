[project]
name = "remote-driving"
version = "0.1.0"
description = "Remote driving system workspace"
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.5", "tomli>=2; python_version < '3.11'"]

[tool.uv.workspace]
members = [
    "apps/driving",
    "apps/vehicle",
    "apps/server",
    "packages/rd-core",
    "packages/rd-webrtc",
    "packages/rd-quic",
]

[tool.uv.sources]
rd-core = { workspace = true }
rd-webrtc = { workspace = true }
rd-quic = { workspace = true }

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
